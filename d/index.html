<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1410">
<title>Strimo — デザインコード</title>
<meta property="og:title" content="Strimo — モンスターのデザイン">
<meta property="og:description" content="歩くほど、強くなる。Strimo のモンスターデザインを受け取ろう。">
<meta property="og:type" content="website">
<style>
@import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');

:root {
  --bg: #0b1410;
  --panel: #101f18;
  --panel-2: #14261d;
  --line: #1f3a2d;
  --line-bright: #2e5a44;
  --ink: #e7f3ec;
  --ink-dim: #9fc0af;
  --ink-faint: #6d8f7d;
  --green: #3ddc97;
  --green-deep: #17a86b;
  --gold: #ffd166;
  --red: #ff6b6b;
  --pixel: 'DotGothic16', monospace;
  --body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background-image:
    radial-gradient(1px 1px at 18% 22%, rgba(61,220,151,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 74% 12%, rgba(255,209,102,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 42% 64%, rgba(61,220,151,.3) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 48%, rgba(61,220,151,.35) 50%, transparent 51%),
    linear-gradient(rgba(61,220,151,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(61,220,151,.03) 1px, transparent 1px);
  background-size: 1200px 900px, 1200px 900px, 1200px 900px, 1200px 900px, 32px 32px, 32px 32px;
}

::selection { background: var(--green-deep); color: #04130c; }

.card {
  width: 100%;
  max-width: 380px;
  background: var(--panel);
  border: 1px solid var(--line-bright);
  box-shadow: 0 18px 50px rgba(0,0,0,.55);
  padding: 28px 24px 24px;
  text-align: center;
}

.brand {
  font-family: var(--pixel);
  font-size: .85em;
  letter-spacing: .22em;
  color: var(--green);
  margin-bottom: 22px;
}

.art {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 240px;
  margin: 0 auto;
  background: var(--panel-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
}
/* 「動きを減らす」設定の人向け。自動再生はしないが、見たい人は押せる */
.art .play {
  position: absolute;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  padding: 7px 16px;
  font-family: var(--pixel);
  font-size: .82em;
  letter-spacing: .06em;
  color: #04130c;
  background: var(--green);
  border: 1px solid var(--green);
  cursor: pointer;
}
.art canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

.code {
  font-family: var(--pixel);
  font-size: 1.05em;
  letter-spacing: .1em;
  color: var(--ink);
  margin-top: 20px;
  word-break: break-all;
}

.status {
  display: inline-block;
  margin-top: 12px;
  padding: 5px 14px;
  font-family: var(--pixel);
  font-size: .78em;
  letter-spacing: .08em;
  border: 1px solid var(--line-bright);
  color: var(--ink-dim);
}
.status.free { color: var(--green); border-color: rgba(61,220,151,.45); background: rgba(61,220,151,.07); }
.status.paid { color: var(--gold); border-color: rgba(255,209,102,.45); background: rgba(255,209,102,.07); }
.status.error { color: var(--red); border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.07); }

.lede {
  color: var(--ink-dim);
  font-size: .95em;
  margin-top: 18px;
}

.cta {
  display: block;
  margin-top: 22px;
  padding: 14px 18px;
  font-family: var(--pixel);
  font-size: .95em;
  letter-spacing: .06em;
  text-decoration: none;
  color: #04130c;
  background: var(--green);
  border: 1px solid var(--green);
  transition: filter .15s ease;
}
.cta:hover { filter: brightness(1.1); }

.sub {
  display: block;
  margin-top: 12px;
  color: var(--ink-faint);
  font-size: .85em;
  text-decoration: none;
}
.sub:hover { color: var(--ink-dim); }

.form {
  margin-top: 18px;
  display: flex;
  gap: 8px;
}
.form input {
  flex: 1;
  min-width: 0;
  padding: 11px 12px;
  font-family: var(--pixel);
  font-size: .9em;
  letter-spacing: .06em;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--line-bright);
}
.form input:focus { outline: 2px solid var(--green-deep); outline-offset: 1px; }
.form button {
  padding: 11px 16px;
  font-family: var(--pixel);
  font-size: .9em;
  color: #04130c;
  background: var(--green);
  border: 1px solid var(--green);
  cursor: pointer;
}

.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--line-bright);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .spinner { animation: none; }
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">S T R I M O</div>

  <div class="art" id="art"><div class="spinner" role="status" aria-label="読み込み中"></div></div>

  <div class="code" id="code"></div>
  <div id="statusWrap"></div>

  <p class="lede" id="lede"></p>

  <a class="cta" id="cta" href="https://kizzz9.github.io/strimo-support/">アプリを見る</a>
  <a class="sub" href="https://kizzz9.github.io/strimo-support/">Strimo のサポートページ</a>

  <form class="form" id="form" hidden>
    <input id="input" placeholder="STRM-D-XXXXX-YYYY" autocomplete="off" spellcheck="false">
    <button type="submit">見る</button>
  </form>
</main>

<script>
// Supabase の anon キーは公開前提の識別子（アプリのバイナリにも入っている）。
// 実データの保護は RLS と RPC 側で行う
const SUPABASE_URL = 'https://qvfamomkdkywybjnzzal.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2ZmFtb21rZGt5d3liam56emFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MDY5NTEsImV4cCI6MjA4NzM4Mjk1MX0.5bp5iLKHQ4NUYL6mRZaEL1rYKSFi8v4DGbVmy1PgMUE';

// リリース後に App Store のプロダクトページへ差し替える1行
const APP_URL = 'https://kizzz9.github.io/strimo-support/';

const JA = (navigator.language || 'en').toLowerCase().startsWith('ja');
const T = {
  loading:    JA ? '読み込み中…' : 'Loading…',
  notFound:   JA ? 'このコードの作品は見つかりませんでした' : 'No design found for this code',
  offline:    JA ? '通信に失敗しました。時間をおいて試してください' : 'Connection failed. Please try again later.',
  invalid:    JA ? 'コードの形式が違います' : 'That code format is not valid',
  free:       JA ? '無料で共有中' : 'Shared for free',
  paid:       JA ? 'マーケットで販売中' : 'On sale in the Market',
  ledeFree:   JA ? 'このデザインは Strimo アプリで受け取れます。受け取ったモンスターは Lv.1 から育てていきます。'
                 : 'You can receive this design in the Strimo app. The Monster starts at Lv.1 and grows from there.',
  ledePaid:   JA ? '動いているところは誰でも見られます。自分のモンスターとして使うには、Strimo のマーケットで購入してください。売れるたびに作者へ還元されます。'
                 : 'Anyone can watch it move. To use it as your own Monster, buy it in the Strimo Market — the creator earns from every sale.',
  ledeEmpty:  JA ? 'デザインコードを入力すると作品を見られます。' : 'Enter a design code to see the design.',
  cta:        JA ? 'Strimo を見る' : 'See Strimo',
  support:    JA ? 'Strimo のサポートページ' : 'Strimo support',
  play:       JA ? '▶ 動かす' : '▶ Play',
};

const CODE_RE = /^STRM-D-[A-Z0-9]{5}-[0-9]{4}$/;

const artEl = document.getElementById('art');
const codeEl = document.getElementById('code');
const statusWrap = document.getElementById('statusWrap');
const ledeEl = document.getElementById('lede');
const ctaEl = document.getElementById('cta');
const formEl = document.getElementById('form');
const inputEl = document.getElementById('input');

ctaEl.textContent = T.cta;
ctaEl.href = APP_URL;
document.querySelector('.sub').textContent = T.support;

/** URL からコードを取り出す。?c= を優先し、パス末尾も受ける */
function codeFromLocation() {
  const q = new URLSearchParams(location.search).get('c');
  if (q) return q.trim().toUpperCase();
  const last = location.pathname.split('/').filter(Boolean).pop() || '';
  // 壊れたパーセントエンコード（%E0%A4%A 等）で decodeURIComponent は throw する。
  // ここで落ちると以降の初期化が走らず、スピナーのまま固まる
  let decoded;
  try {
    decoded = decodeURIComponent(last);
  } catch (e) {
    decoded = last;
  }
  decoded = decoded.trim().toUpperCase();
  return CODE_RE.test(decoded) ? decoded : '';
}

/** "{size}|{color}*{count},..." を展開する。T は透明 */
function parseRLE(text) {
  const bar = text.indexOf('|');
  if (bar < 0) return null;
  const size = parseInt(text.slice(0, bar), 10);
  if (!Number.isInteger(size) || size <= 0 || size > 128) return null;

  const total = size * size;
  const flat = [];
  for (const seg of text.slice(bar + 1).split(',')) {
    if (!seg) continue;
    const star = seg.indexOf('*');
    const color = (star < 0 ? seg : seg.slice(0, star));
    const count = star < 0 ? 1 : parseInt(seg.slice(star + 1), 10);
    if (!Number.isInteger(count) || count <= 0 || flat.length + count > total) return null;
    const value = color === 'T' ? '' : color;
    for (let i = 0; i < count; i++) flat.push(value);
  }
  if (flat.length !== total) return null;
  return { size, flat };
}

// 展開後の上限。128x128 を全マス別色（"#RRGGBB*1," = 10文字）でも 164KB 程度なので
// 1MB あれば正規のデータは通る。
// 上限が無いと、圧縮すると小さいが展開すると数百MBになるデータ（zip bomb）を
// 公開されただけで閲覧者のタブを潰せる。サーバ側は圧縮後のサイズしか見られない
const MAX_INFLATED_BYTES = 1024 * 1024;

/** "Z:{size}|{base64}" は raw DEFLATE。Apple の COMPRESSION_ZLIB が生の deflate を吐く */
async function inflateRaw(bytes) {
  for (const format of ['deflate-raw', 'deflate']) {
    try {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format));
      const reader = stream.getReader();
      const chunks = [];
      let total = 0;
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          total += value.byteLength;
          // 全部読み切ってから測ると手遅れなので、読みながら打ち切る
          if (total > MAX_INFLATED_BYTES) {
            await reader.cancel();
            return null;
          }
          chunks.push(value);
        }
      } finally {
        reader.releaseLock();
      }
      return new TextDecoder().decode(await new Blob(chunks).arrayBuffer());
    } catch (e) { /* 次の形式を試す */ }
  }
  return null;
}

async function decodePreview(raw) {
  if (!raw) return null;
  if (!raw.startsWith('Z:')) return parseRLE(raw);

  const body = raw.slice(2);
  const bar = body.indexOf('|');
  if (bar < 0) return null;
  let bytes;
  try {
    bytes = Uint8Array.from(atob(body.slice(bar + 1)), c => c.charCodeAt(0));
  } catch (e) { return null; }
  const text = await inflateRaw(bytes);
  return text ? parseRLE(text) : null;
}

/** 2つの 6桁 hex を alpha で線形補間する（アプリの flattened() と同じ近似合成） */
function blendHex(base, over, alpha) {
  const p = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(h);
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const b = p(base), o = p(over);
  if (!b || !o) return over;
  const mix = (i) => Math.round(o[i] * alpha + b[i] * (1 - alpha));
  return '#' + [0, 1, 2].map(i => mix(i).toString(16).padStart(2, '0')).join('').toUpperCase();
}

/** レイヤーを下から重ねて1枚に潰す。アプリ側 LayeredPixelData.flattened() と同じ順序・同じ扱い */
function flattenLayers(layered) {
  const size = layered && layered.size;
  if (!Number.isInteger(size) || size <= 0 || size > 128) return null;
  const flat = new Array(size * size).fill('');
  const layers = Array.isArray(layered.layers) ? layered.layers : [];

  for (let i = layers.length - 1; i >= 0; i--) {
    const layer = layers[i];
    if (!layer || layer.isVisible === false) continue;
    const alpha = Math.min(1, Math.max(0, layer.opacity === undefined ? 1 : layer.opacity));
    if (alpha <= 0.01) continue;
    const rows = Array.isArray(layer.pixels) ? layer.pixels : [];
    for (let y = 0; y < Math.min(size, rows.length); y++) {
      const row = Array.isArray(rows[y]) ? rows[y] : [];
      for (let x = 0; x < Math.min(size, row.length); x++) {
        const color = row[x];
        if (!color) continue;
        const idx = y * size + x;
        flat[idx] = (alpha >= 0.99 || !flat[idx]) ? color : blendHex(flat[idx], color, alpha);
      }
    }
  }
  return { size, flat };
}

/** アニメーション JSON を、再生順に並べたコマ列へ変換する */
function decodeAnimation(json) {
  let anim;
  try { anim = JSON.parse(json); } catch (e) { return null; }
  if (!anim || !Array.isArray(anim.frames) || anim.frames.length < 2) return null;

  const maxFrames = 64;   // アプリ側と同じ上限
  const frames = [];
  for (const frame of anim.frames.slice(0, maxFrames)) {
    const pixels = flattenLayers(frame && frame.layeredData);
    if (!pixels) return null;
    const raw = Number(frame.duration);
    const duration = (Number.isFinite(raw) && raw > 0) ? Math.min(raw, 5) : 0.2;
    frames.push({ pixels, duration });
  }
  if (frames.length < 2) return null;

  // ping_pong は往復（両端は重ねない）
  if (anim.playbackMode === 'ping_pong') {
    for (let i = frames.length - 2; i >= 1; i--) frames.push(frames[i]);
  }
  return frames;
}

function paint(ctx, pixels) {
  const { size, flat } = pixels;
  ctx.clearRect(0, 0, size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const color = flat[y * size + x];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

let animationTimer = null;

/** 静止画（frames が無いとき）またはアニメーションを描く */
function draw(pixels, frames) {
  if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }

  const size = (frames && frames[0].pixels.size) || pixels.size;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  artEl.replaceChildren(canvas);

  if (!frames) {
    paint(ctx, pixels);
    return;
  }

  let i = 0;
  const step = () => {
    paint(ctx, frames[i].pixels);
    const wait = Math.max(60, frames[i].duration * 1000);
    i = (i + 1) % frames.length;
    animationTimer = setTimeout(step, wait);
  };

  // OS で「動きを減らす」を選んでいる人には自動再生しない。
  // ただしアニメーションはこのページの見せ物なので、隠さずに再生ボタンを出す
  const reduced = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduced) {
    step();
    return;
  }

  paint(ctx, frames[0].pixels);
  const play = document.createElement('button');
  play.className = 'play';
  play.type = 'button';
  play.textContent = T.play;
  play.addEventListener('click', () => { play.remove(); step(); }, { once: true });
  artEl.appendChild(play);
}

function showStatus(text, kind) {
  const el = document.createElement('div');
  el.className = 'status' + (kind ? ' ' + kind : '');
  el.textContent = text;
  statusWrap.replaceChildren(el);
}

function showEmptyArt() {
  if (animationTimer) { clearTimeout(animationTimer); animationTimer = null; }
  artEl.replaceChildren();
}

async function load(code) {
  codeEl.textContent = code;
  statusWrap.replaceChildren();
  ledeEl.textContent = T.loading;
  artEl.replaceChildren(Object.assign(document.createElement('div'), { className: 'spinner' }));

  let json;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/redeem_design_code', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON,
        'Authorization': 'Bearer ' + SUPABASE_ANON,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_design_code: code }),
    });
    json = await res.json();
  } catch (e) {
    showEmptyArt();
    showStatus(T.offline, 'error');
    ledeEl.textContent = '';
    return;
  }

  if (!json || json.ok === false) {
    showEmptyArt();
    showStatus(T.notFound, 'error');
    ledeEl.textContent = '';
    formEl.hidden = false;
    return;
  }

  const pixels = await decodePreview(json.preview_pixel_data);
  // アニメーションは無料公開作品にだけ付いてくる（有料は購入して初めて手に入る）
  const frames = json.animation_json ? decodeAnimation(json.animation_json) : null;
  if (frames || pixels) {
    draw(pixels, frames);
  } else {
    showEmptyArt();
  }

  const isPaid = json.distribution === 'paid';
  showStatus(isPaid ? T.paid : T.free, isPaid ? 'paid' : 'free');
  ledeEl.textContent = isPaid ? T.ledePaid : T.ledeFree;
}

formEl.addEventListener('submit', (e) => {
  e.preventDefault();
  const code = inputEl.value.trim().toUpperCase();
  if (!CODE_RE.test(code)) {
    showStatus(T.invalid, 'error');
    return;
  }
  history.replaceState(null, '', '?c=' + encodeURIComponent(code));
  load(code);
});

const initial = codeFromLocation();
if (CODE_RE.test(initial)) {
  load(initial);
} else {
  showEmptyArt();
  ledeEl.textContent = T.ledeEmpty;
  formEl.hidden = false;
}
</script>
</body>
